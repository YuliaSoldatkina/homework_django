<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Контакты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Catalog</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Главная</a>
                <a class="nav-link" href="/contacts/">Контакты</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h1 class="mb-4">Контактная информация</h1>

                <div class="card mb-4">
                    <div class="card-body">
                        <h2 class="h5 card-title">Наши контакты</h2>
                        <p class="card-text mb-1"><strong>Телефон:</strong> +7 (900) 000-00-00</p>
                        <p class="card-text mb-1"><strong>Email:</strong> info@example.com</p>
                        <p class="card-text mb-0"><strong>Адрес:</strong> г. Владивосток</p>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <h2 class="h5 card-title">Мы на карте</h2>
                        <div class="ratio ratio-16x9">
                            <iframe
                                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1749.987!2d131.885!3d43.115!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNDPCsDA2JzU0LjAiTiAxMzHCsDUzJzA2LjAiRQ!5e0!3m2!1sru!2sru!4v1700000000000"
                                style="border:0;"
                                allowfullscreen=""
                                loading="lazy">
                            </iframe>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-light py-3 mt-auto">
        <div class="container text-center">
            <p class="mb-0">Учебный проект Django</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
