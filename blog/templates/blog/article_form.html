{% extends "catalog/base.html" %}

{% block title %}Форма статьи{% endblock %}

{% block content %}
<h1 class="mb-4">
    {% if article %}
        Редактирование статьи
    {% else %}
        Добавление статьи
    {% endif %}
</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'blog:article_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
