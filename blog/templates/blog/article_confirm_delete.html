{% extends "catalog/base.html" %}

{% block title %}Удаление статьи{% endblock %}

{% block content %}
<h1 class="mb-4">Удалить статью?</h1>

<p>Вы уверены, что хотите удалить статью «{{ article.title }}»?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'blog:article_detail' article.pk %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
